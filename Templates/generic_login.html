<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:32px;width:340px;}
h1{font-size:20px;margin:0 0 20px;}
input{width:100%;padding:10px;margin:6px 0 12px;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;box-sizing:border-box;}
button{width:100%;padding:10px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
</style></head>
<body><div class="card"><h1>Sign in</h1>
<form method="POST" action="/submit">
<label>Username or email</label>
<input type="text" name="username" required autofocus>
<label>Password</label>
<input type="password" name="password" required>
<button type="submit">Sign in</button>
</form></div></body></html>
